# LLM Portal — joins the existing llm-gateway network so it can reach 9router
# and OmniRoute by container name. It does not define those services; they are
# owned by the llm-gateway stack.
services:
  portal:
    build: .
    image: llm-portal:${PORTAL_TAG:-dev}
    container_name: llm-gateway-portal
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_PATH: /data/portal.db
    volumes:
      - llm-portal-data:/data
    ports:
      # Tailscale-only listener, matching the rest of the gateway.
      - "100.88.64.101:20140:8080"
      # Codex pins its OAuth callback to port 1455; both host ports reach the
      # same Fastify listener inside the container.
      - "100.88.64.101:1455:8080"
    networks:
      - llm-gateway

volumes:
  llm-portal-data:

networks:
  llm-gateway:
    external: true
