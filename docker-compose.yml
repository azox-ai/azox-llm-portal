# Sponsor Portal — joins the existing llm-gateway network so it can reach
# 9router and OmniRoute by container name. It does not define those services;
# they are owned by the llm-gateway stack.
services:
  sponsor-portal:
    build: .
    image: sponsor-portal:dev
    container_name: sponsor-portal
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_PATH: /data/portal.db
    volumes:
      - sponsor-portal-data:/data
    ports:
      # Tailscale-only listener, matching the rest of the gateway.
      - "127.0.0.1:20140:8080"
      # Codex pins its OAuth callback to port 1455 on the host.
      - "127.0.0.1:1455:1455"
    networks:
      - llm-gateway

volumes:
  sponsor-portal-data:

networks:
  llm-gateway:
    external: true
